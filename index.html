<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocaLearn - تعلم اللغات والمهارات من أي مكان</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366F1;
            --dark: #111827;
            --light: #FFFFFF;
            --accent: #C7D2FE;
            --gray: #6B7280;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --shadow-soft: 0 8px 32px rgba(99, 102, 241, 0.12);
            --shadow-glow: 0 0 40px rgba(99, 102, 241, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(180deg, #FFFFFF 0%, #C7D2FE 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--dark);
            position: relative;
        }

        /* Background Floating Shapes */
        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: floatShape 20s infinite ease-in-out;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: rgba(99, 102, 241, 0.25);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 300px;
            height: 300px;
            background: rgba(199, 210, 254, 0.6);
            bottom: 10%;
            left: -80px;
            animation-delay: -5s;
            animation-duration: 25s;
        }

        .shape-3 {
            width: 250px;
            height: 250px;
            background: rgba(99, 102, 241, 0.15);
            top: 40%;
            right: 10%;
            animation-delay: -10s;
            animation-duration: 22s;
        }

        .shape-4 {
            width: 180px;
            height: 180px;
            background: rgba(167, 139, 250, 0.2);
            bottom: 20%;
            right: 20%;
            animation-delay: -15s;
            animation-duration: 18s;
        }

        @keyframes floatShape {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(99, 102, 241, 0.3);
            border-radius: 50%;
            animation: particleFloat 15s infinite linear;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(50px); opacity: 0; }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* Page Entry Animation */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease-out forwards;
        }

        .fade-in-delay-1 { animation-delay: 0.2s; }
        .fade-in-delay-2 { animation-delay: 0.4s; }
        .fade-in-delay-3 { animation-delay: 0.6s; }
        .fade-in-delay-4 { animation-delay: 0.8s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 48px;
            font-weight: 800;
            font-size: 2rem;
            color: var(--dark);
            letter-spacing: -0.5px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary) 0%, #8B5CF6 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
        }

        .logo-icon svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        /* Hero Image Section */
        .hero-wrapper {
            position: relative;
            width: 100%;
            max-width: 700px;
            margin-bottom: 48px;
        }

        .hero-image-container {
            position: relative;
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(99, 102, 241, 0.2), 0 0 0 1px rgba(255,255,255,0.5) inset;
            animation: heroFloat 6s ease-in-out infinite;
        }

        .hero-image-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        @keyframes heroFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* Floating Glass Cards */
        .glass-card {
            position: absolute;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px 18px;
            box-shadow: var(--shadow-soft);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--dark);
            animation: cardFloat 5s ease-in-out infinite;
            z-index: 20;
        }

        .glass-card svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .card-1 {
            top: -20px;
            left: -30px;
            animation-delay: 0s;
        }

        .card-2 {
            top: 20%;
            right: -40px;
            animation-delay: -2s;
        }

        .card-3 {
            bottom: 30px;
            left: -20px;
            animation-delay: -4s;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }

        /* Text Content */
        .content {
            text-align: center;
            max-width: 640px;
        }

        .headline {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            color: var(--dark);
            line-height: 1.3;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .description {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            color: var(--gray);
            line-height: 1.8;
            margin-bottom: 40px;
            font-weight: 400;
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Primary Button */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--primary);
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            padding: 18px 48px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn-primary:hover {
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.45), 0 0 60px rgba(99, 102, 241, 0.15);
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary svg {
            width: 22px;
            height: 22px;
            transition: transform 0.3s;
        }

        .btn-primary:hover svg {
            transform: translateX(-4px);
        }

        /* Scroll Reveal */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Stats / Trust Badges */
        .trust-badges {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 60px;
            flex-wrap: wrap;
        }

        .badge {
            text-align: center;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .badge:hover {
            opacity: 1;
        }

        .badge-number {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            display: block;
            line-height: 1;
        }

        .badge-label {
            font-size: 0.85rem;
            color: var(--gray);
            margin-top: 6px;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            .glass-card {
                display: none;
            }

            .hero-wrapper {
                max-width: 100%;
            }

            .trust-badges {
                gap: 24px;
            }

            .shape-1, .shape-2 {
                width: 200px;
                height: 200px;
            }
        }

        /* Loading shimmer for image */
        .hero-image-container {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: heroFloat 6s ease-in-out infinite, shimmer 2s infinite;
        }

        .hero-image-container img {
            animation: none;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .hero-image-container.loaded {
            animation: heroFloat 6s ease-in-out infinite;
            background: none;
        }
    </style>
<base target="_blank">
</head>
<body>
    <!-- Background Shapes -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
    </div>

    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <!-- Main Content -->
    <div class="container">
        <!-- Logo -->
        <div class="logo fade-in">
            <div class="logo-icon">
                <img src="logo.png" alt="شعار VocaLearn" style="width: 100%; height: 100%; object-fit: cover; border-radius: 14px;">
            </div>
            VocaLearn
        </div>

        <!-- Hero Section -->
        <div class="hero-wrapper fade-in fade-in-delay-1">
            <div class="hero-image-container" id="heroContainer">
                <img src="hi.png" 
                     alt="طالب يدرس عبر الإنترنت باستخدام اللابتوب والسماعات" 
                     onload="document.getElementById('heroContainer').classList.add('loaded')">
            </div>

            <!-- Floating Glass Cards -->
            <div class="glass-card card-1">
                <svg viewBox="0 0 24 24" fill="none" stroke="#6366F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c0 1.66 4 3 9 3s9-1.34 9-3v-5"/>
                </svg>
                <span>+5000 طالب</span>
            </div>

            <div class="glass-card card-2">
                <svg viewBox="0 0 24 24" fill="none" stroke="#6366F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 6v6l4 2"/>
                </svg>
                <span>تعلم بسرعتك</span>
            </div>

            <div class="glass-card card-3">
                <svg viewBox="0 0 24 24" fill="none" stroke="#6366F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                <span>شهادات معتمدة</span>
            </div>
        </div>

        <!-- Text Content -->
        <div class="content">
            <h1 class="headline fade-in fade-in-delay-2">
                تعلم اللغات والمهارات من أي مكان
            </h1>
            <p class="description fade-in fade-in-delay-3">
                منصة تعليمية حديثة تربط الطلاب بالأساتذة الخبراء عبر تجربة تعليمية تفاعلية واحترافية عبر الإنترنت.
            </p>
            <a href="home.html" class="btn-primary fade-in fade-in-delay-4">
                <span>ابدأ التعلم</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"/>
                    <path d="M12 5l7 7-7 7"/>
                </svg>
            </a>
        </div>
    <script>
        // Generate particles
        const particlesContainer = document.getElementById('particles');
        const particleCount = 20;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (15 + Math.random() * 20) + 's';
            particle.style.animationDelay = (Math.random() * 15) + 's';
            particle.style.width = (4 + Math.random() * 4) + 'px';
            particle.style.height = particle.style.width;
            particle.style.opacity = 0.2 + Math.random() * 0.3;
            particlesContainer.appendChild(particle);
        }

        // Scroll reveal
        const revealElements = document.querySelectorAll('.reveal');

        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, { threshold: 0.1 });

        revealElements.forEach(el => revealObserver.observe(el));

        // Smooth parallax for shapes on mouse move
        document.addEventListener('mousemove', (e) => {
            const shapes = document.querySelectorAll('.shape');
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;

            shapes.forEach((shape, index) => {
                const factor = (index + 1) * 0.5;
                shape.style.transform = `translate(${x * factor}px, ${y * factor}px)`;
            });
        });
    </script>
</body>
</html>
